name: balansoft_ws
description: Balansoft-WS - Sistema de Estación de Pesaje
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Estado
  flutter_bloc: ^8.1.3
  bloc: ^8.1.2
  equatable: ^2.0.5

  # Networking
  dio: ^5.3.2
  connectivity_plus: ^4.0.2

  # Database
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0
  shared_preferences: ^2.2.1
  path: ^1.9.0

  # Security
  flutter_secure_storage: ^9.0.0
  jwt_decoder: ^2.0.1

  # DI
  get_it: ^7.6.4

  # Utilities
  device_info_plus: ^9.0.3
  intl: ^0.20.3
  path_provider: ^2.0.15
  permission_handler: ^11.0.1
  uuid: ^4.2.1

  # UI
  flutter_svg: ^2.0.7
  shimmer: ^3.0.0
  google_fonts: ^6.1.0

  # File handling
  image_picker: ^1.0.7

  # Kiosk (desktop: fullscreen sin bordes en producción)
  window_manager: ^0.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  mockito: ^5.4.2
  build_runner: ^2.4.6
  bloc_test: ^9.1.3
  integration_test:
    sdk: flutter

  # Tests: fake de ConnectivityPlatform (misma versión que connectivity_plus 4.0.2)
  connectivity_plus_platform_interface: ^1.2.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: BalansoftBrand
      fonts:
        - asset: assets/fonts/BLADRMF_.TTF

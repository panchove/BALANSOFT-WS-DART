name: balansoft_ws
description: Balansoft-WS - Sistema de Estación de Pesaje
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  url_launcher: ^6.3.3

  # Estado
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1
  equatable: ^3.0.0

  # Networking
  dio: ^5.3.2
  connectivity_plus: ^7.3.2

  # Database
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0
  shared_preferences: ^2.2.1
  path: ^1.9.0

  # Security
  flutter_secure_storage: ^11.2.0
  jwt_decoder: ^2.0.1

  # DI
  get_it: ^9.3.0

  # Utilities
  device_info_plus: ^13.3.0
  intl: ^0.20.3
  path_provider: ^2.0.15
  permission_handler: ^13.0.2
  uuid: ^4.2.1

  # UI
  flutter_svg: ^2.0.7
  shimmer: ^4.0.0
  google_fonts: ^9.0.0

  # File handling
  image_picker: ^1.0.7

  # Kiosk (desktop: fullscreen sin bordes en producción)
  window_manager: ^0.5.2

  # Notificaciones nativas del SO (Linux: dbus, Windows: WinRT FFI; ambas
  # implementaciones son Dart puro, sin CMake de sistema).
  flutter_local_notifications: ^22.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.2
  build_runner: ^2.4.6
  bloc_test: ^10.0.0
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

  # Tests: fake de ConnectivityPlatform (misma versión que connectivity_plus 4.0.2)
  connectivity_plus_platform_interface: ^2.1.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: BalansoftBrand
      fonts:
        - asset: assets/fonts/BLADRMF_.TTF
    # ── DSEG: indicadores LCD industriales ──────────────────────────
    - family: DSEG7ClassicBold
      fonts:
        - asset: assets/fonts/DSEG7Classic-Bold.ttf
    - family: DSEG7ClassicRegular
      fonts:
        - asset: assets/fonts/DSEG7-Classic/DSEG7Classic-Regular.ttf
    - family: DSEG7ModernBold
      fonts:
        - asset: assets/fonts/DSEG7-Modern/DSEG7Modern-Bold.ttf
    - family: DSEG14ClassicBold
      fonts:
        - asset: assets/fonts/DSEG14Classic-Bold.ttf
    - family: DSEG14ClassicRegular
      fonts:
        - asset: assets/fonts/DSEG14-Classic/DSEG14Classic-Regular.ttf
    - family: DSEG14ModernBold
      fonts:
        - asset: assets/fonts/DSEG14-Modern/DSEG14Modern-Bold.ttf

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "../BALANSOFT-WS.png"
  web:
    generate: true
    image_path: "../BALANSOFT-WS.png"
    background_color: "#1a3a5c"
    theme_color: "#1a3a5c"
  windows:
    generate: true
    image_path: "../BALANSOFT-WS.png"
    icon_size: 48
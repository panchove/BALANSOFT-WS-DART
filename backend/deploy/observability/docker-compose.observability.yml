# Stack de observabilidad de BALANSOFT-WS en desarrollo (H6 de ACTUAR.md)
#
# Levanta Prometheus + Alertmanager + Grafana y los conecta con la API que ya
# esté corriendo en tu máquina (el backend expone /metrics con METRICS_ENABLED).
#
# Uso:
#   cd backend
#   docker compose -f deploy/observability/docker-compose.observability.yml up -d
#   # Prometheus: http://localhost:9090     (objetivo "balansoft-api" en Status)
#   # Grafana:    http://localhost:3000     (admin / admin — solo dev)
#   # Alertmanager: http://localhost:9093
#   docker compose -f deploy/observability/docker-compose.observability.yml down
#
# IMPORTANTE: las credenciales de abajo son de ejemplo y NO sirven para
# producción. Este archivo se versiona en Git: nunca pongas secretos reales.
#
# Ver README.md en esta carpeta para lo que queda pendiente de infraestructura.

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: balansoft-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts:/etc/prometheus/rules:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    # Linux: el backend corre en el host, no en la red de este compose.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: balansoft-alertmanager
    restart: unless-stopped
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager

  grafana:
    image: grafana/grafana:11.2.0
    container_name: balansoft-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # Valores de EJEMPLO. En producción, cámbialos por secretos reales y
      # desactiva el acceso anónimo.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/balansoft-overview.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - alertmanager

volumes:
  grafana-data: